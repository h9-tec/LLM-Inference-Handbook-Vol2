<rect x="32" y="26" width="54" height="24" rx="6" fill="#22221f" stroke="#33332f"/><text x="59" y="43" font-size="12" fill="#c3c2b7" text-anchor="middle" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace" >Ch 16</text><text x="100" y="44" font-size="20" fill="#ffffff" text-anchor="start" font-weight="700" >DeepSeek&#x27;s 24 hours: the decode pool is 4.5x the prefill pool</text><text x="32" y="68" font-size="13" fill="#8b8a82" text-anchor="start" font-weight="normal" >V3 and R1 on H800, February 27 to 28, 2025. Per-user speed was chosen, not optimized.</text><rect x="32" y="96" width="300" height="150" rx="10" fill="#22221f" stroke="#3987e5"/><text x="52" y="124" font-size="14" fill="#ffffff" text-anchor="start" font-weight="700" >Prefill unit</text><text x="52" y="156" font-size="22" fill="#3987e5" text-anchor="start" font-weight="800" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace" >4 nodes, EP32</text><text x="52" y="186" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="normal" >73.7k input tok/s per node</text><text x="52" y="206" font-size="11" fill="#8b8a82" text-anchor="start" font-weight="normal" >cache hits included</text><rect x="356" y="96" width="812" height="150" rx="10" fill="#22221f" stroke="#d95926"/><text x="376" y="124" font-size="14" fill="#ffffff" text-anchor="start" font-weight="700" >Decode unit</text><text x="376" y="156" font-size="22" fill="#d95926" text-anchor="start" font-weight="800" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace" >18 nodes, EP144</text><text x="376" y="186" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="normal" >14.8k output tok/s per node    2 routed experts per GPU    20 to 22 tok/s per user    4,989 KV tokens per output token</text><text x="376" y="206" font-size="11" fill="#8b8a82" text-anchor="start" font-weight="normal" >throughput per GPU is the economic variable; tokens per second per user is a product variable</text><rect x="376" y="218" width="36" height="16" rx="3" fill="#d95926" opacity="0.6"/><rect x="418" y="218" width="36" height="16" rx="3" fill="#d95926" opacity="0.6"/><rect x="460" y="218" width="36" height="16" rx="3" fill="#d95926" opacity="0.6"/><rect x="502" y="218" width="36" height="16" rx="3" fill="#d95926" opacity="0.6"/><rect x="544" y="218" width="36" height="16" rx="3" fill="#d95926" opacity="0.6"/><rect x="586" y="218" width="36" height="16" rx="3" fill="#d95926" opacity="0.6"/><rect x="628" y="218" width="36" height="16" rx="3" fill="#d95926" opacity="0.6"/><rect x="670" y="218" width="36" height="16" rx="3" fill="#d95926" opacity="0.6"/><rect x="712" y="218" width="36" height="16" rx="3" fill="#d95926" opacity="0.6"/><rect x="754" y="218" width="36" height="16" rx="3" fill="#d95926" opacity="0.6"/><rect x="796" y="218" width="36" height="16" rx="3" fill="#d95926" opacity="0.6"/><rect x="838" y="218" width="36" height="16" rx="3" fill="#d95926" opacity="0.6"/><rect x="880" y="218" width="36" height="16" rx="3" fill="#d95926" opacity="0.6"/><rect x="922" y="218" width="36" height="16" rx="3" fill="#d95926" opacity="0.6"/><rect x="964" y="218" width="36" height="16" rx="3" fill="#d95926" opacity="0.6"/><rect x="1006" y="218" width="36" height="16" rx="3" fill="#d95926" opacity="0.6"/><rect x="1048" y="218" width="36" height="16" rx="3" fill="#d95926" opacity="0.6"/><rect x="1090" y="218" width="36" height="16" rx="3" fill="#d95926" opacity="0.6"/><rect x="52" y="218" width="36" height="16" rx="3" fill="#3987e5" opacity="0.6"/><rect x="94" y="218" width="36" height="16" rx="3" fill="#3987e5" opacity="0.6"/><rect x="136" y="218" width="36" height="16" rx="3" fill="#3987e5" opacity="0.6"/><rect x="178" y="218" width="36" height="16" rx="3" fill="#3987e5" opacity="0.6"/><text x="32" y="282" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="normal" >226.75 nodes average in service, 278 peak.  $87,072 per day at $2 per GPU-hour against $562,027 theoretical at R1 pricing (545% margin, actual lower).</text>
