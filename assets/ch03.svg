<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="E2M1 representable values">
<title>E2M1 representable values</title>
<defs><linearGradient id="acc" x1="0" x2="1"><stop offset="0" stop-color="#3987e5"/><stop offset="0.5" stop-color="#199e70"/><stop offset="1" stop-color="#d95926"/></linearGradient><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1c1c1b"/><stop offset="1" stop-color="#141413"/></linearGradient></defs>
<rect x="0.5" y="0.5" width="1199" height="299" rx="14" fill="url(#bg)" stroke="#33332f"/>
<rect x="24" y="0" width="1152" height="3" rx="1.5" fill="url(#acc)"/>
<rect x="32" y="26" width="46" height="24" rx="6" fill="#22221f" stroke="#33332f"/><text x="55" y="43" font-size="12" fill="#c3c2b7" text-anchor="middle" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace" >Ch 3</text><text x="92" y="44" font-size="20" fill="#ffffff" text-anchor="start" font-weight="700" >E2M1 has no 5</text><text x="32" y="68" font-size="13" fill="#8b8a82" text-anchor="start" font-weight="normal" >The sixteen encodings of a 4-bit float, as a share of the block maximum. Everything from 66.6% to 100% lands in one gap.</text><rect x="773.3" y="126" width="346.7" height="88" rx="8" fill="#d03b3b" opacity="0.18"/><text x="946.6666666666667" y="116" font-size="12" fill="#d03b3b" text-anchor="middle" font-weight="700" >the 4 to 6 gap: 33% of the range, 1 of 8 magnitudes</text><line x1="80" y1="170" x2="1120" y2="170" stroke="#8b8a82" stroke-width="2"/><circle cx="80.0" cy="170" r="9" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/><text x="80.0" y="202" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace" >0</text><text x="80.0" y="220" font-size="11" fill="#8b8a82" text-anchor="middle" font-weight="normal" >0%</text><circle cx="166.7" cy="170" r="9" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/><text x="166.66666666666669" y="202" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace" >0.5</text><text x="166.66666666666669" y="220" font-size="11" fill="#8b8a82" text-anchor="middle" font-weight="normal" >8%</text><circle cx="253.3" cy="170" r="9" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/><text x="253.33333333333334" y="202" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace" >1</text><text x="253.33333333333334" y="220" font-size="11" fill="#8b8a82" text-anchor="middle" font-weight="normal" >17%</text><circle cx="340.0" cy="170" r="9" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/><text x="340.0" y="202" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace" >1.5</text><text x="340.0" y="220" font-size="11" fill="#8b8a82" text-anchor="middle" font-weight="normal" >25%</text><circle cx="426.7" cy="170" r="9" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/><text x="426.6666666666667" y="202" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace" >2</text><text x="426.6666666666667" y="220" font-size="11" fill="#8b8a82" text-anchor="middle" font-weight="normal" >33%</text><circle cx="600.0" cy="170" r="9" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/><text x="600.0" y="202" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace" >3</text><text x="600.0" y="220" font-size="11" fill="#8b8a82" text-anchor="middle" font-weight="normal" >50%</text><circle cx="773.3" cy="170" r="9" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/><text x="773.3333333333334" y="202" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace" >4</text><text x="773.3333333333334" y="220" font-size="11" fill="#8b8a82" text-anchor="middle" font-weight="normal" >67%</text><circle cx="1120.0" cy="170" r="9" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/><text x="1120.0" y="202" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace" >6</text><text x="1120.0" y="220" font-size="11" fill="#8b8a82" text-anchor="middle" font-weight="normal" >100%</text><circle cx="946.7" cy="170" r="9" fill="none" stroke="#d03b3b" stroke-width="2" stroke-dasharray="3 3"/><text x="946.6666666666667" y="152" font-size="12" fill="#d03b3b" text-anchor="middle" font-weight="600" >5 (83%)  rounds to 4 or 6: 20% error</text><text x="32" y="272" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="normal" >NVFP4: 16-element blocks, E4M3 scale.   MXFP4: 32-element blocks, power-of-two scale, about 40% more MSE.</text>
</svg>
