<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Tensor parallel decode regimes">
<title>Tensor parallel decode regimes</title>
<defs><linearGradient id="acc" x1="0" x2="1"><stop offset="0" stop-color="#3987e5"/><stop offset="0.5" stop-color="#199e70"/><stop offset="1" stop-color="#d95926"/></linearGradient><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1c1c1b"/><stop offset="1" stop-color="#141413"/></linearGradient></defs>
<rect x="0.5" y="0.5" width="1199" height="299" rx="14" fill="url(#bg)" stroke="#33332f"/>
<rect x="24" y="0" width="1152" height="3" rx="1.5" fill="url(#acc)"/>
<rect x="32" y="26" width="54" height="24" rx="6" fill="#22221f" stroke="#33332f"/><text x="59" y="43" font-size="12" fill="#c3c2b7" text-anchor="middle" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace" >Ch 13</text><text x="100" y="44" font-size="20" fill="#ffffff" text-anchor="start" font-weight="700" >Two regimes for the all-reduce</text><text x="32" y="68" font-size="13" fill="#8b8a82" text-anchor="start" font-weight="normal" >Message size per layer, 70B model in BF16. The spec sheet number predicts the left column only.</text><rect x="32" y="96" width="556" height="150" rx="10" fill="#22221f" stroke="#3987e5"/><text x="52" y="124" font-size="14" fill="#ffffff" text-anchor="start" font-weight="700" >Prefill, 4k-token prompt</text><text x="52" y="156" font-size="26" fill="#3987e5" text-anchor="start" font-weight="800" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace" >tens of MB</text><text x="52" y="182" font-size="13" fill="#3987e5" text-anchor="start" font-weight="600" >bandwidth-bound</text><text x="52" y="210" font-size="11" fill="#c3c2b7" text-anchor="start" font-weight="normal" >NVLink GB/s matters. On PCIe L40S, all-reduce reached 65% of prefill</text><text x="52" y="228" font-size="11" fill="#c3c2b7" text-anchor="start" font-weight="normal" >latency.</text><rect x="612" y="96" width="556" height="150" rx="10" fill="#22221f" stroke="#d95926"/><text x="632" y="124" font-size="14" fill="#ffffff" text-anchor="start" font-weight="700" >Decode, batch 32</text><text x="632" y="156" font-size="26" fill="#d95926" text-anchor="start" font-weight="800" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace" >512 KB</text><text x="632" y="182" font-size="13" fill="#d95926" text-anchor="start" font-weight="600" >latency-bound</text><text x="632" y="210" font-size="11" fill="#c3c2b7" text-anchor="start" font-weight="normal" >Fixed cost per collective dominates. NCCL 1.5x to 2x slower than MPI</text><text x="632" y="228" font-size="11" fill="#c3c2b7" text-anchor="start" font-weight="normal" >here; NVRAR 1.9x to 3.6x faster than NCCL.</text><text x="32" y="278" font-size="12" fill="#199e70" text-anchor="start" font-weight="600" >Rule: measure all-reduce latency at 128 KB to 1 MB on your topology before choosing TP degree. Replicas beat ranks for decode.</text>
</svg>
