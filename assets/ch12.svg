<rect x="0.5" y="0.5" width="1199" height="299" rx="14" fill="url(#bg)" stroke="#33332f"/>
<rect x="24" y="0" width="1152" height="3" rx="1.5" fill="url(#acc)"/>
<rect x="32" y="26" width="54" height="24" rx="6" fill="#22221f" stroke="#33332f"/><text x="59" y="43" font-size="12" fill="#c3c2b7" text-anchor="middle" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace" >Ch 12</text><text x="100" y="44" font-size="20" fill="#ffffff" text-anchor="start" font-weight="700" >CUDA graph capture list: pad up or fall back</text><text x="32" y="68" font-size="13" fill="#8b8a82" text-anchor="start" font-weight="normal" >TensorRT-LLM default sizes. A batch between captured sizes is padded to the next one.</text><line x1="60" y1="150" x2="1140" y2="150" stroke="#8b8a82" stroke-width="2"/><line x1="60.0" y1="140" x2="60.0" y2="160" stroke="#3987e5" stroke-width="2"/><line x1="158.2" y1="140" x2="158.2" y2="160" stroke="#3987e5" stroke-width="2"/><line x1="256.4" y1="140" x2="256.4" y2="160" stroke="#3987e5" stroke-width="2"/><line x1="354.5" y1="140" x2="354.5" y2="160" stroke="#3987e5" stroke-width="2"/><line x1="452.7" y1="140" x2="452.7" y2="160" stroke="#3987e5" stroke-width="2"/><line x1="510.2" y1="140" x2="510.2" y2="160" stroke="#3987e5" stroke-width="2"/><line x1="550.9" y1="140" x2="550.9" y2="160" stroke="#3987e5" stroke-width="2"/><line x1="582.5" y1="140" x2="582.5" y2="160" stroke="#3987e5" stroke-width="2"/><line x1="608.3" y1="140" x2="608.3" y2="160" stroke="#3987e5" stroke-width="2"/><line x1="630.2" y1="140" x2="630.2" y2="160" stroke="#3987e5" stroke-width="2"/><line x1="649.1" y1="140" x2="649.1" y2="160" stroke="#3987e5" stroke-width="2"/><line x1="665.8" y1="140" x2="665.8" y2="160" stroke="#3987e5" stroke-width="2"/><line x1="680.7" y1="140" x2="680.7" y2="160" stroke="#3987e5" stroke-width="2"/><line x1="694.2" y1="140" x2="694.2" y2="160" stroke="#3987e5" stroke-width="2"/><line x1="706.5" y1="140" x2="706.5" y2="160" stroke="#3987e5" stroke-width="2"/><line x1="717.9" y1="140" x2="717.9" y2="160" stroke="#3987e5" stroke-width="2"/><line x1="728.4" y1="140" x2="728.4" y2="160" stroke="#3987e5" stroke-width="2"/><line x1="738.1" y1="140" x2="738.1" y2="160" stroke="#3987e5" stroke-width="2"/><line x1="747.3" y1="140" x2="747.3" y2="160" stroke="#3987e5" stroke-width="2"/><line x1="845.5" y1="140" x2="845.5" y2="160" stroke="#3987e5" stroke-width="2"/><line x1="943.6" y1="140" x2="943.6" y2="160" stroke="#3987e5" stroke-width="2"/><line x1="1041.8" y1="140" x2="1041.8" y2="160" stroke="#3987e5" stroke-width="2"/><line x1="1140.0" y1="140" x2="1140.0" y2="160" stroke="#3987e5" stroke-width="2"/><text x="60.0" y="180" font-size="11" fill="#c3c2b7" text-anchor="middle" font-weight="400" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace" >1</text><text x="354.5454545454545" y="180" font-size="11" fill="#c3c2b7" text-anchor="middle" font-weight="400" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace" >8</text><text x="550.9090909090909" y="180" font-size="11" fill="#c3c2b7" text-anchor="middle" font-weight="400" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace" >32</text><text x="747.2727272727273" y="180" font-size="11" fill="#c3c2b7" text-anchor="middle" font-weight="400" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace" >128</text><text x="845.4545454545455" y="180" font-size="11" fill="#c3c2b7" text-anchor="middle" font-weight="400" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace" >256</text><text x="943.6363636363637" y="180" font-size="11" fill="#c3c2b7" text-anchor="middle" font-weight="400" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace" >512</text><text x="1041.8181818181818" y="180" font-size="11" fill="#c3c2b7" text-anchor="middle" font-weight="400" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace" >1024</text><text x="1140.0" y="180" font-size="11" fill="#c3c2b7" text-anchor="middle" font-weight="400" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace" >2048</text><rect x="845.5" y="114" width="98.2" height="22" rx="4" fill="#d03b3b" opacity="0.25"/><circle cx="867.9" cy="150" r="7" fill="#d95926"/><text x="867.9203805214138" y="106" font-size="12" fill="#d95926" text-anchor="middle" font-weight="700" >batch 300 pads to 512: 41% of the step is padding</text><text x="32" y="222" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="normal" >23 captured sizes by default (log scale above). Dense below 128, coarse above it, which is where high-concurrency serving lives.</text><text x="32" y="244" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="normal" >Adding 64-step graphs above 128: up to 1.3x to 1.5x throughput on GB200. Capturing 259 graphs: 2.6 GB, KV pool down 17.2%, throughput down 5%.</text><text x="32" y="272" font-size="12" fill="#199e70" text-anchor="start" font-weight="600" >The graphs and the KV cache compete for the same HBM.</text>
</svg>
