<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="CUDA graph capture list">
<title>CUDA graph capture list</title>
