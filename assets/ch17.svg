ns Mono', 'SFMono-Regular', Consolas, Menlo, monospace" >94%</text><text x="351.6" y="188" font-size="10" fill="#c3c2b7" text-anchor="middle" font-weight="normal" >call 4</text><rect x="424.0" y="91.6" width="28" height="78.4" rx="4" fill="#199e70" opacity="0.9"/><text x="438.0" y="85.6" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace" >98%</text><text x="438.0" y="188" font-size="10" fill="#c3c2b7" text-anchor="middle" font-weight="normal" >call 5</text><rect x="715.6" y="126.0" width="28" height="44.0" rx="4" fill="#d95926" opacity="0.9"/><text x="729.6" y="120.0" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace" >55%</text><text x="729.6" y="188" font-size="10" fill="#c3c2b7" text-anchor="middle" font-weight="normal" >next user turn</text><rect x="802.0" y="101.2" width="28" height="68.8" rx="4" fill="#3987e5" opacity="0.9"/><text x="816.0" y="95.2" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace" >86%</text><text x="816.0" y="188" font-size="10" fill="#c3c2b7" text-anchor="middle" font-weight="normal" >call</text><rect x="888.4" y="94.8" width="28" height="75.2" rx="4" fill="#3987e5" opacity="0.9"/><text x="902.4" y="88.8" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace" >94%</text><text x="902.4" y="188" font-size="10" fill="#c3c2b7" text-anchor="middle" font-weight="normal" >call</text><rect x="1039.6" y="144.4" width="28" height="25.6" rx="4" fill="#d03b3b" opacity="0.9"/><text x="1053.6" y="138.4" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace" >32%</text><text x="1053.6" y="188" font-size="10" fill="#c3c2b7" text-anchor="middle" font-weight="normal" >after compaction</text><rect x="470.4" y="74" width="226.8" height="90" rx="6" fill="#d95926" opacity="0.12"/><text x="583.8" y="94" font-size="11" fill="#d95926" text-anchor="middle" font-weight="700" >human think time</text><text x="583.8" y="110" font-size="11" fill="#d95926" text-anchor="middle" font-weight="400" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace" >172 s median gap</text><text x="265.2" y="210" font-size="11" fill="#8b8a82" text-anchor="middle" font-weight="normal" >1.2 s between tool calls</text><text x="32" y="250" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="normal" >Median within a turn: 98%.  Across a turn boundary: 55%.  Compaction (7.8% of sessions, 44.2% of tokens): median 66.1% drop.  Model switch: 8%.</text><text x="32" y="272" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="normal" >Median prompt 68k tokens, input to output above 275:1, 33 turns per session. Per-instance caching with load balancing: 1.7%; shared KV store: 92.2%.</text><text x="32" y="300" font-size="12" fill="#199e70" text-anchor="start" font-weight="600" >Set TTL from the inter-turn gap distribution and route by session, not by load.</text>
