<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Batch invariance mechanism">
<title>Batch invariance mechanism</title>
<defs><linearGradient id="acc" x1="0" x2="1"><stop offset="0" stop-color="#3987e5"/><stop offset="0.5" stop-color="#199e70"/><stop offset="1" stop-color="#d95926"/></linearGradient><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1c1c1b"/><stop offset="1" stop-color="#141413"/></linearGradient></defs>
<rect x="0.5" y="0.5" width="1199" height="329" rx="14" fill="url(#bg)" stroke="#33332f"/>
<rect x="24" y="0" width="1152" height="3" rx="1.5" fill="url(#acc)"/>
<rect x="32" y="26" width="46" height="24" rx="6" fill="#22221f" stroke="#33332f"/><text x="55" y="43" font-size="12" fill="#c3c2b7" text-anchor="middle" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace" >Ch 1</text><text x="92" y="44" font-size="20" fill="#ffffff" text-anchor="start" font-weight="700" >Same request, two batches, two answers</text><text x="32" y="68" font-size="13" fill="#8b8a82" text-anchor="start" font-weight="normal" >The kernel is deterministic for a fixed shape. The shape is set by whoever else arrived in the same step.</text><text x="32" y="134" font-size="14" fill="#ffffff" text-anchor="start" font-weight="700" >Quiet server</text><text x="32" y="154" font-size="12" fill="#8b8a82" text-anchor="start" font-weight="400" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace" >batch = 1</text><rect x="170" y="122" width="18" height="34" rx="4" fill="#3987e5"/><path d="M 470 139 L 540 139" stroke="#33332f" stroke-width="2"/><path d="M 534 133 L 544 139 L 534 145" fill="none" stroke="#33332f" stroke-width="2"/><rect x="552" y="116" width="250" height="46" rx="8" fill="#22221f" stroke="#33332f"/><text x="677" y="136" font-size="11" fill="#8b8a82" text-anchor="middle" font-weight="normal" >reduction strategy</text><text x="677" y="154" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace" >one row per core</text><path d="M 802 139 L 870 139" stroke="#33332f" stroke-width="2"/><path d="M 864 133 L 874 139 L 864 145" fill="none" stroke="#33332f" stroke-width="2"/><rect x="882" y="116" width="286" height="46" rx="8" fill="#22221f" stroke="#3987e5"/><text x="1025" y="136" font-size="11" fill="#8b8a82" text-anchor="middle" font-weight="normal" >your row, last bits</text><text x="1025" y="154" font-size="13" fill="#3987e5" text-anchor="middle" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace" >logit = 12.734 192</text><text x="32" y="234" font-size="14" fill="#ffffff" text-anchor="start" font-weight="700" >Busy server</text><text x="32" y="254" font-size="12" fill="#8b8a82" text-anchor="start" font-weight="400" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace" >batch = 32</text><rect x="170" y="222" width="18" height="34" rx="4" fill="#d95926"/><rect x="192" y="222" width="18" height="34" rx="4" fill="#3a3a37"/><rect x="214" y="222" width="18" height="34" rx="4" fill="#3a3a37"/><rect x="236" y="222" width="18" height="34" rx="4" fill="#3a3a37"/><rect x="258" y="222" width="18" height="34" rx="4" fill="#3a3a37"/><rect x="280" y="222" width="18" height="34" rx="4" fill="#3a3a37"/><rect x="302" y="222" width="18" height="34" rx="4" fill="#3a3a37"/><rect x="324" y="222" width="18" height="34" rx="4" fill="#3a3a37"/><rect x="346" y="222" width="18" height="34" rx="4" fill="#3a3a37"/><rect x="368" y="222" width="18" height="34" rx="4" fill="#3a3a37"/><rect x="390" y="222" width="18" height="34" rx="4" fill="#3a3a37"/><rect x="412" y="222" width="18" height="34" rx="4" fill="#3a3a37"/><text x="440" y="246" font-size="14" fill="#8b8a82" text-anchor="start" font-weight="normal" >...</text><path d="M 470 239 L 540 239" stroke="#33332f" stroke-width="2"/><path d="M 534 233 L 544 239 L 534 245" fill="none" stroke="#33332f" stroke-width="2"/><rect x="552" y="216" width="250" height="46" rx="8" fill="#22221f" stroke="#33332f"/><text x="677" y="236" font-size="11" fill="#8b8a82" text-anchor="middle" font-weight="normal" >reduction strategy</text><text x="677" y="254" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace" >split-K, partial sums</text><path d="M 802 239 L 870 239" stroke="#33332f" stroke-width="2"/><path d="M 864 233 L 874 239 L 864 245" fill="none" stroke="#33332f" stroke-width="2"/><rect x="882" y="216" width="286" height="46" rx="8" fill="#22221f" stroke="#d95926"/><text x="1025" y="236" font-size="11" fill="#8b8a82" text-anchor="middle" font-weight="normal" >your row, last bits</text><text x="1025" y="254" font-size="13" fill="#d95926" text-anchor="middle" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace" >logit = 12.734 188</text><text x="32" y="310" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="normal" >Near-tie at argmax, temperature 0: the token flips. 1,000 runs of Qwen3-235B produced about 80 distinct completions.</text>
</svg>
