" >100%</text><text x="350" y="168.0" font-size="13" fill="#c3c2b7" text-anchor="end" font-weight="400" >After kernel-level losses (very common)</text><rect x="362" y="150.0" width="326.4" height="26.0" rx="4" fill="#3987e5" opacity="0.92"/><rect x="362" y="150.0" width="4" height="26.0" fill="#3987e5"/><text x="698.3636363636364" y="168.0" font-size="12" fill="#ffffff" text-anchor="start" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace" >50%</text><text x="350" y="215.33333333333334" font-size="13" fill="#c3c2b7" text-anchor="end" font-weight="400" >After latency bound and operating buffer</text><rect x="362" y="197.3" width="65.3" height="26.0" rx="4" fill="#d95926" opacity="0.92"/><rect x="362" y="197.3" width="4" height="26.0" fill="#d95926"/><text x="437.27272727272725" y="215.33333333333334" font-size="12" fill="#ffffff" text-anchor="start" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace" >10%  plan here</text><text x="1168" y="284" font-size="11" fill="#8b8a82" text-anchor="end" font-weight="normal" >Anthropic&#x27;s 2025 postmortem: a routing bug hit 16% of Sonnet 4 requests at peak and an XLA top-k bug dropped the best token. Evals passed.</text>
