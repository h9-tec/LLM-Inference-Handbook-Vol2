<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Cold start is CPU-bound">
<title>Cold start is CPU-bound</title>
<defs><linearGradient id="acc" x1="0" x2="1"><stop offset="0" stop-color="#3987e5"/><stop offset="0.5" stop-color="#199e70"/><stop offset="1" stop-color="#d95926"/></linearGradient><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1c1c1b"/><stop offset="1" stop-color="#141413"/></linearGradient></defs>
<rect x="0.5" y="0.5" width="1199" height="259" rx="14" fill="url(#bg)" stroke="#33332f"/>
<rect x="24" y="0" width="1152" height="3" rx="1.5" fill="url(#acc)"/>
<rect x="32" y="26" width="54" height="24" rx="6" fill="#22221f" stroke="#33332f"/><text x="59" y="43" font-size="12" fill="#c3c2b7" text-anchor="middle" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace" >Ch 15</text><text x="100" y="44" font-size="20" fill="#ffffff" text-anchor="start" font-weight="700" >Cold start is CPU-bound</text><text x="32" y="68" font-size="13" fill="#8b8a82" text-anchor="start" font-weight="normal" >vLLM startup, Llama-3.2-3B on an H100, 20.32 s total. Faster storage improved the total by 1.04x.</text><rect x="32.0" y="110" width="253.5" height="46" rx="5" fill="#3987e5" opacity="0.92"/><text x="159.74409448818898" y="138.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace" >22%</text><line x1="159.7" y1="160" x2="159.7" y2="170" stroke="#33332f"/><text x="159.74409448818898" y="182" font-size="12" fill="#c3c2b7" text-anchor="middle" font-weight="normal" >weight loading  4.57 s</text><rect x="287.5" y="110" width="269.7" height="46" rx="5" fill="#d95926" opacity="0.92"/><text x="423.3385826771654" y="138.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace" >24%</text><line x1="423.3" y1="160" x2="423.3" y2="192" stroke="#33332f"/><text x="423.3385826771654" y="204" font-size="12" fill="#c3c2b7" text-anchor="middle" font-weight="normal" >load compiled graphs  4.86 s</text><rect x="559.2" y="110" width="219.4" height="46" rx="5" fill="#c98500" opacity="0.92"/><text x="669.8818897637796" y="138.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace" >19%</text><line x1="669.9" y1="160" x2="669.9" y2="170" stroke="#33332f"/><text x="669.8818897637796" y="182" font-size="12" fill="#c3c2b7" text-anchor="middle" font-weight="normal" >CUDA graph capture  3.96 s</text><rect x="780.6" y="110" width="385.4" height="46" rx="5" fill="#4a4a46" opacity="0.92"/><text x="974.2874015748031" y="138.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace" >34%</text><line x1="974.3" y1="160" x2="974.3" y2="192" stroke="#33332f"/><text x="974.2874015748031" y="204" font-size="12" fill="#c3c2b7" text-anchor="middle" font-weight="normal" >import, init, profiling, allocation  6.93 s</text><text x="1168" y="96" font-size="12" fill="#8b8a82" text-anchor="end" font-weight="normal" >20.32 s, one CPU core pinned at 100% throughout</text><text x="1168" y="244" font-size="11" fill="#8b8a82" text-anchor="end" font-weight="normal" >Startup varied 4x across nine vLLM releases on the same hardware (7.8 s to 36.41 s)</text>
</svg>
