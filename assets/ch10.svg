<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Structured output and speculation code path">
<title>Structured output and speculation code path</title>
<defs><linearGradient id="acc" x1="0" x2="1"><stop offset="0" stop-color="#3987e5"/><stop offset="0.5" stop-color="#199e70"/><stop offset="1" stop-color="#d95926"/></linearGradient><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1c1c1b"/><stop offset="1" stop-color="#141413"/></linearGradient></defs>
<rect x="0.5" y="0.5" width="1199" height="259" rx="14" fill="url(#bg)" stroke="#33332f"/>
<rect x="24" y="0" width="1152" height="3" rx="1.5" fill="url(#acc)"/>
<rect x="32" y="26" width="54" height="24" rx="6" fill="#22221f" stroke="#33332f"/><text x="59" y="43" font-size="12" fill="#c3c2b7" text-anchor="middle" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace" >Ch 10</text><text x="100" y="44" font-size="20" fill="#ffffff" text-anchor="start" font-weight="700" >Two fast features, one serial path</text><text x="32" y="68" font-size="13" fill="#8b8a82" text-anchor="start" font-weight="normal" >vLLM structured output manager, V1: what happens when speculation is on</text><rect x="32" y="96" width="540" height="120" rx="10" fill="#22221f" stroke="#199e70"/><text x="52" y="122" font-size="12" fill="#199e70" text-anchor="start" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace" >num_speculative_tokens == 0  and  &gt; 128 structured requests</text><text x="52" y="148" font-size="13" fill="#ffffff" text-anchor="start" font-weight="normal" >thread pool fills the bitmask in parallel</text><text x="52" y="170" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="normal" >cost: amortized across workers</text><text x="52" y="196" font-size="12" fill="#8b8a82" text-anchor="start" font-weight="normal" >benchmarked, fast</text><rect x="628" y="96" width="540" height="120" rx="10" fill="#22221f" stroke="#d03b3b"/><text x="648" y="122" font-size="12" fill="#d03b3b" text-anchor="start" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace" >speculation on</text><text x="648" y="148" font-size="13" fill="#ffffff" text-anchor="start" font-weight="normal" >for each request: for each draft position: accept, mask, rollback</text><text x="648" y="170" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="normal" >serial, on the CPU, inside the scheduler step</text><text x="648" y="196" font-size="12" fill="#8b8a82" text-anchor="start" font-weight="normal" >cost: (structured requests) x (1 + k), blocks the next GPU step</text><text x="32" y="242" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="normal" >Grammar-rejected drafts become -1 and are subtracted from num_draft_tokens, so the acceptance-rate dashboard stays green while speedup falls.</text>
</svg>
