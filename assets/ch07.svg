', Consolas, Menlo, monospace" >98%  median</text><text x="420" y="144.57142857142858" font-size="13" fill="#c3c2b7" text-anchor="end" font-weight="400" >Alibaba consumer chat</text><rect x="432" y="129.7" width="401.8" height="19.7" rx="4" fill="#3987e5" opacity="0.92"/><rect x="432" y="129.7" width="4" height="19.7" fill="#3987e5"/><text x="843.76" y="144.57142857142858" font-size="12" fill="#ffffff" text-anchor="start" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace" >62%</text><text x="420" y="176.2857142857143" font-size="13" fill="#c3c2b7" text-anchor="end" font-weight="400" >DeepSeek API, 24h (disk cache)</text><rect x="432" y="161.5" width="364.8" height="19.7" rx="4" fill="#3987e5" opacity="0.92"/><rect x="432" y="161.5" width="4" height="19.7" fill="#3987e5"/><text x="806.8240000000001" y="176.2857142857143" font-size="12" fill="#ffffff" text-anchor="start" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace" >56.3%</text><text x="420" y="208.0" font-size="13" fill="#c3c2b7" text-anchor="end" font-weight="400" >Alibaba enterprise API</text><rect x="432" y="193.2" width="349.9" height="19.7" rx="4" fill="#3987e5" opacity="0.92"/><rect x="432" y="193.2" width="4" height="19.7" fill="#3987e5"/><text x="791.9200000000001" y="208.0" font-size="12" fill="#ffffff" text-anchor="start" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace" >54%</text><text x="420" y="239.71428571428572" font-size="13" fill="#c3c2b7" text-anchor="end" font-weight="400" >Copilot, across a user-turn boundary</text><rect x="432" y="224.9" width="356.4" height="19.7" rx="4" fill="#d95926" opacity="0.92"/><rect x="432" y="224.9" width="4" height="19.7" fill="#d95926"/><text x="798.4000000000001" y="239.71428571428572" font-size="12" fill="#ffffff" text-anchor="start" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace" >55%  TTL-bound</text><text x="420" y="271.42857142857144" font-size="13" fill="#c3c2b7" text-anchor="end" font-weight="400" >Mooncake consumer chat</text><rect x="432" y="256.6" width="330.5" height="19.7" rx="4" fill="#3987e5" opacity="0.92"/><rect x="432" y="256.6" width="4" height="19.7" fill="#3987e5"/><text x="772.48" y="271.42857142857144" font-size="12" fill="#ffffff" text-anchor="start" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace" >51%</text><text x="420" y="303.1428571428571" font-size="13" fill="#c3c2b7" text-anchor="end" font-weight="400" >Multi-instance vLLM, per-instance cache, Codex traces</text><rect x="432" y="288.3" width="11.0" height="19.7" rx="4" fill="#d03b3b" opacity="0.92"/><rect x="432" y="288.3" width="4" height="19.7" fill="#d03b3b"/><text x="453.016" y="303.1428571428571" font-size="12" fill="#ffffff" text-anchor="start" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace" >1.7%  load-balanced</text><text x="1168" y="364" font-size="11" fill="#8b8a82" text-anchor="end" font-weight="normal" >Sources: Alibaba ATC &#x27;25, DeepSeek Feb 2025, Mooncake, Microsoft Research 2026, vLLM Mooncake Store post</text>
