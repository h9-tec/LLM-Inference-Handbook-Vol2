 x="350" y="142.75" font-size="13" fill="#c3c2b7" text-anchor="end" font-weight="400" >Decode, measured, upper end</text><rect x="362" y="128.3" width="283.4" height="18.9" rx="4" fill="#3987e5" opacity="0.92"/><rect x="362" y="128.3" width="4" height="18.9" fill="#3987e5"/><text x="655.421052631579" y="142.75" font-size="12" fill="#ffffff" text-anchor="start" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace" >300 W</text><text x="350" y="173.25" font-size="13" fill="#c3c2b7" text-anchor="end" font-weight="400" >Decode, measured, lower end</text><rect x="362" y="158.8" width="129.4" height="18.9" rx="4" fill="#3987e5" opacity="0.92"/><rect x="362" y="158.8" width="4" height="18.9" fill="#3987e5"/><text x="501.42894736842106" y="173.25" font-size="12" fill="#ffffff" text-anchor="start" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace" >137 W</text><text x="350" y="203.75" font-size="13" fill="#c3c2b7" text-anchor="end" font-weight="400" >Saved per GPU by locking clocks to 780 MHz</text><rect x="362" y="189.3" width="85.0" height="18.9" rx="4" fill="#199e70" opacity="0.92"/><rect x="362" y="189.3" width="4" height="18.9" fill="#199e70"/><text x="457.0263157894737" y="203.75" font-size="12" fill="#ffffff" text-anchor="start" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace" >90 W  (up to, under 1% throughput loss)</text><text x="1168" y="264" font-size="11" fill="#8b8a82" text-anchor="end" font-weight="normal" >Power caps from 280 W to 700 W never engaged during decode. They bite during prefill, the TTFT phase.</text>
