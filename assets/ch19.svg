<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="KV cache timing side channel">
<title>KV cache timing side channel</title>
<defs><linearGradient id="acc" x1="0" x2="1"><stop offset="0" stop-color="#3987e5"/><stop offset="0.5" stop-color="#199e70"/><stop offset="1" stop-color="#d95926"/></linearGradient><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1c1c1b"/><stop offset="1" stop-color="#141413"/></linearGradient></defs>
<rect x="0.5" y="0.5" width="1199" height="279" rx="14" fill="url(#bg)" stroke="#33332f"/>
<rect x="24" y="0" width="1152" height="3" rx="1.5" fill="url(#acc)"/>
<rect x="32" y="26" width="54" height="24" rx="6" fill="#22221f" stroke="#33332f"/><text x="59" y="43" font-size="12" fill="#c3c2b7" text-anchor="middle" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace" >Ch 19</text><text x="100" y="44" font-size="20" fill="#ffffff" text-anchor="start" font-weight="700" >A prefix hit is a timing signal</text><text x="32" y="68" font-size="13" fill="#8b8a82" text-anchor="start" font-weight="normal" >Shared prefix cache across tenants: the attacker extends a guess one block at a time and watches TTFT</text><rect x="32" y="110" width="216" height="64" rx="8" fill="#22221f" stroke="#199e70"/><text x="44" y="134" font-size="11" fill="#ffffff" text-anchor="start" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace" >The patient</text><text x="44" y="158" font-size="11" fill="#199e70" text-anchor="start" font-weight="normal" >TTFT low: hit, keep going</text><rect x="264" y="110" width="216" height="64" rx="8" fill="#22221f" stroke="#199e70"/><text x="276" y="134" font-size="11" fill="#ffffff" text-anchor="start" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace" >The patient is</text><text x="276" y="158" font-size="11" fill="#199e70" text-anchor="start" font-weight="normal" >TTFT low: hit, keep going</text><rect x="496" y="110" width="216" height="64" rx="8" fill="#22221f" stroke="#199e70"/><text x="508" y="134" font-size="11" fill="#ffffff" text-anchor="start" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace" >The patient is John</text><text x="508" y="158" font-size="11" fill="#199e70" text-anchor="start" font-weight="normal" >TTFT low: hit, keep going</text><rect x="728" y="110" width="216" height="64" rx="8" fill="#22221f" stroke="#199e70"/><text x="740" y="134" font-size="11" fill="#ffffff" text-anchor="start" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace" >The patient is John Smith</text><text x="740" y="158" font-size="11" fill="#199e70" text-anchor="start" font-weight="normal" >TTFT low: hit, keep going</text><rect x="960" y="110" width="216" height="64" rx="8" fill="#22221f" stroke="#d03b3b"/><text x="972" y="134" font-size="11" fill="#ffffff" text-anchor="start" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace" >The patient is John Doe</text><text x="972" y="158" font-size="11" fill="#d03b3b" text-anchor="start" font-weight="normal" >TTFT high: miss, backtrack</text><text x="32" y="212" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="normal" >Signal strength on live vLLM: Cohen&#x27;s d 0.78 with no load, 0.21 with two background workers; AUROC 0.650 to 0.531. Weaker, not closed.</text><text x="32" y="234" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="normal" >Defenses: per-tenant partition (loses the shared-template hits), selective sharing, owner-tracked continuation, block granularity (k = 16), timing padding.</text><text x="32" y="262" font-size="12" fill="#199e70" text-anchor="start" font-weight="600" >Decide explicitly whether the cache crosses tenants. Every major engine defaults to yes.</text>
</svg>
