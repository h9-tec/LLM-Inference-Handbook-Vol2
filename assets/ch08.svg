<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Prefix cache hash chain">
<title>Prefix cache hash chain</title>
<defs><linearGradient id="acc" x1="0" x2="1"><stop offset="0" stop-color="#3987e5"/><stop offset="0.5" stop-color="#199e70"/><stop offset="1" stop-color="#d95926"/></linearGradient><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1c1c1b"/><stop offset="1" stop-color="#141413"/></linearGradient></defs>
<rect x="0.5" y="0.5" width="1199" height="299" rx="14" fill="url(#bg)" stroke="#33332f"/>
<rect x="24" y="0" width="1152" height="3" rx="1.5" fill="url(#acc)"/>
<rect x="32" y="26" width="46" height="24" rx="6" fill="#22221f" stroke="#33332f"/><text x="55" y="43" font-size="12" fill="#c3c2b7" text-anchor="middle" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace" >Ch 8</text><text x="92" y="44" font-size="20" fill="#ffffff" text-anchor="start" font-weight="700" >Hashes chain from block 0</text><text x="32" y="68" font-size="13" fill="#8b8a82" text-anchor="start" font-weight="normal" >Each block hash includes the previous hash. One changed byte, anywhere, resets everything after it.</text><rect x="40" y="120" width="128" height="54" rx="8" fill="#3987e5" opacity="0.92"/><text x="104.0" y="144" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600" >system prompt</text><text x="104.0" y="162" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="400" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace" >h0 = H(tokens)</text><text x="104.0" y="194" font-size="11" fill="#3987e5" text-anchor="middle" font-weight="700" >hit</text><path d="M 170 147 L 182 147" stroke="#33332f" stroke-width="2"/><rect x="184" y="120" width="128" height="54" rx="8" fill="#3987e5" opacity="0.92"/><text x="248.0" y="144" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600" >few-shot</text><text x="248.0" y="162" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="400" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace" >h1 = H(h0, tokens)</text><text x="248.0" y="194" font-size="11" fill="#3987e5" text-anchor="middle" font-weight="700" >hit</text><path d="M 314 147 L 326 147" stroke="#33332f" stroke-width="2"/><rect x="328" y="120" width="128" height="54" rx="8" fill="#3987e5" opacity="0.92"/><text x="392.0" y="144" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600" >turn 1</text><text x="392.0" y="162" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="400" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace" >h2 = H(h1, tokens)</text><text x="392.0" y="194" font-size="11" fill="#3987e5" text-anchor="middle" font-weight="700" >hit</text><path d="M 458 147 L 470 147" stroke="#33332f" stroke-width="2"/><rect x="472" y="120" width="128" height="54" rx="8" fill="#3987e5" opacity="0.92"/><text x="536.0" y="144" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600" >turn 2</text><text x="536.0" y="162" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="400" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace" >h3 = H(h2, tokens)</text><text x="536.0" y="194" font-size="11" fill="#3987e5" text-anchor="middle" font-weight="700" >hit</text><path d="M 602 147 L 614 147" stroke="#33332f" stroke-width="2"/><rect x="616" y="120" width="128" height="54" rx="8" fill="#d03b3b" opacity="0.92"/><text x="680.0" y="144" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600" >tool result</text><text x="680.0" y="162" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="400" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace" >h4 = H(h3, tokens)</text><text x="680.0" y="194" font-size="11" fill="#d03b3b" text-anchor="middle" font-weight="700" >changed byte</text><path d="M 746 147 L 758 147" stroke="#33332f" stroke-width="2"/><rect x="760" y="120" width="128" height="54" rx="8" fill="#3a3a37" opacity="0.8"/><text x="824.0" y="144" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600" >turn 3</text><text x="824.0" y="162" font-size="10" fill="#c3c2b7" text-anchor="middle" font-weight="400" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace" >h5 = H(h4, tokens)</text><text x="824.0" y="194" font-size="11" fill="#8b8a82" text-anchor="middle" font-weight="700" >miss</text><path d="M 890 147 L 902 147" stroke="#33332f" stroke-width="2"/><rect x="904" y="120" width="128" height="54" rx="8" fill="#3a3a37" opacity="0.8"/><text x="968.0" y="144" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600" >turn 4</text><text x="968.0" y="162" font-size="10" fill="#c3c2b7" text-anchor="middle" font-weight="400" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace" >h6 = H(h5, tokens)</text><text x="968.0" y="194" font-size="11" fill="#3a3a37" text-anchor="middle" font-weight="700" >miss</text><path d="M 1034 147 L 1046 147" stroke="#33332f" stroke-width="2"/><rect x="1048" y="120" width="128" height="54" rx="8" fill="#3a3a37" opacity="0.8"/><text x="1112.0" y="144" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600" >new message</text><text x="1112.0" y="162" font-size="10" fill="#c3c2b7" text-anchor="middle" font-weight="400" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace" >h7 = H(h6, tokens)</text><text x="1112.0" y="194" font-size="11" fill="#3a3a37" text-anchor="middle" font-weight="700" >miss</text><text x="32" y="232" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="normal" >Usual culprits for the changed byte: a date in the template, a think block stripped by turn index, a re-serialized tool JSON,</text><text x="32" y="252" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="normal" >a different LoRA name in the hash, a 528-token block on a hybrid model, or NFC reordering a shadda.</text><text x="32" y="280" font-size="12" fill="#199e70" text-anchor="start" font-weight="600" >Diagnostic: POST /tokenize with two consecutive turns, diff the token IDs, read the first differing index.</text>
</svg>
