<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="vLLM bottleneck ordering">
<title>vLLM bottleneck ordering</title>
<defs><linearGradient id="acc" x1="0" x2="1"><stop offset="0" stop-color="#3987e5"/><stop offset="0.5" stop-color="#199e70"/><stop offset="1" stop-color="#d95926"/></linearGradient><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1c1c1b"/><stop offset="1" stop-color="#141413"/></linearGradient></defs>
<rect x="0.5" y="0.5" width="1199" height="239" rx="14" fill="url(#bg)" stroke="#33332f"/>
<rect x="24" y="0" width="1152" height="3" rx="1.5" fill="url(#acc)"/>
<rect x="32" y="26" width="54" height="24" rx="6" fill="#22221f" stroke="#33332f"/><text x="59" y="43" font-size="12" fill="#c3c2b7" text-anchor="middle" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace" >Ch 11</text><text x="100" y="44" font-size="20" fill="#ffffff" text-anchor="start" font-weight="700" >The bottleneck ladder, V1 architecture</text><text x="32" y="68" font-size="13" fill="#8b8a82" text-anchor="start" font-weight="normal" >Where the limit usually sits, from most to least common. Detokenization runs in the API process, not the GPU worker.</text><rect x="32" y="108" width="176" height="48" rx="8" fill="#3987e5" opacity="0.9"/><text x="120.0" y="137" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700" >KV / VRAM</text><path d="M 212 132 L 220 132" stroke="#33332f" stroke-width="2"/><rect x="224" y="108" width="176" height="48" rx="8" fill="#3987e5" opacity="0.9"/><text x="312.0" y="137" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700" >GPU compute</text><path d="M 404 132 L 412 132" stroke="#33332f" stroke-width="2"/><rect x="416" y="108" width="176" height="48" rx="8" fill="#199e70" opacity="0.9"/><text x="504.0" y="137" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700" >scheduling</text><path d="M 596 132 L 604 132" stroke="#33332f" stroke-width="2"/><rect x="608" y="108" width="176" height="48" rx="8" fill="#d95926" opacity="0.9"/><text x="696.0" y="137" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700" >API CPU</text><path d="M 788 132 L 796 132" stroke="#33332f" stroke-width="2"/><rect x="800" y="108" width="176" height="48" rx="8" fill="#c98500" opacity="0.9"/><text x="888.0" y="137" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700" >ZMQ transport</text><path d="M 980 132 L 988 132" stroke="#33332f" stroke-width="2"/><rect x="992" y="108" width="176" height="48" rx="8" fill="#3a3a37" opacity="0.9"/><text x="1080.0" y="137" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700" >WAN</text><text x="32" y="190" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="normal" >GPU idle, engine queue empty, request rate rising: look at API CPU. Mitigation: --api-server-count N.</text><text x="32" y="212" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="normal" >Template handling is part of the model: Kimi K2 tool-call success went from under 20% to 4.4x better with no weight change.</text>
</svg>
