<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="p50 versus p99 request path">
<title>p50 versus p99 request path</title>
<defs><linearGradient id="acc" x1="0" x2="1"><stop offset="0" stop-color="#3987e5"/><stop offset="0.5" stop-color="#199e70"/><stop offset="1" stop-color="#d95926"/></linearGradient><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1c1c1b"/><stop offset="1" stop-color="#141413"/></linearGradient></defs>
<rect x="0.5" y="0.5" width="1199" height="329" rx="14" fill="url(#bg)" stroke="#33332f"/>
<rect x="24" y="0" width="1152" height="3" rx="1.5" fill="url(#acc)"/>
<rect x="32" y="26" width="46" height="24" rx="6" fill="#22221f" stroke="#33332f"/><text x="55" y="43" font-size="12" fill="#c3c2b7" text-anchor="middle" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace" >Ch 6</text><text x="92" y="44" font-size="20" fill="#ffffff" text-anchor="start" font-weight="700" >p50 meets the model. p99 meets the scheduler.</text><text x="32" y="68" font-size="13" fill="#8b8a82" text-anchor="start" font-weight="normal" >Two requests, same model, same prompt length. Only the scheduler&#x27;s decisions differ.</text><text x="32" y="124" font-size="14" fill="#ffffff" text-anchor="start" font-weight="700" >p50</text><rect x="150" y="104" width="70" height="32" rx="6" fill="#3987e5" opacity="0.9"/><text x="185.0" y="125" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600" >admit</text><rect x="224" y="104" width="150" height="32" rx="6" fill="#3987e5" opacity="0.9"/><text x="299.0" y="125" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600" >prefill</text><rect x="378" y="104" width="400" height="32" rx="6" fill="#3987e5" opacity="0.9"/><text x="578.0" y="125" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600" >decode</text><text x="32" y="196" font-size="14" fill="#ffffff" text-anchor="start" font-weight="700" >p99</text><rect x="150" y="176" width="110" height="32" rx="6" fill="#3a3a37" opacity="0.9"/><text x="205.0" y="197" font-size="11" fill="#c3c2b7" text-anchor="middle" font-weight="600" >queue wait</text><rect x="264" y="176" width="150" height="32" rx="6" fill="#3987e5" opacity="0.9"/><text x="339.0" y="197" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600" >prefill</text><rect x="418" y="176" width="120" height="32" rx="6" fill="#3987e5" opacity="0.9"/><text x="478.0" y="197" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600" >decode</text><rect x="542" y="176" width="170" height="32" rx="6" fill="#d03b3b" opacity="0.9"/><text x="627.0" y="197" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600" >preempted: blocks freed</text><rect x="716" y="176" width="90" height="32" rx="6" fill="#3a3a37" opacity="0.9"/><text x="761.0" y="197" font-size="11" fill="#c3c2b7" text-anchor="middle" font-weight="600" >wait</text><rect x="810" y="176" width="200" height="32" rx="6" fill="#3987e5" opacity="0.9"/><text x="910.0" y="197" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600" >prefill again</text><rect x="1014" y="176" width="140" height="32" rx="6" fill="#3987e5" opacity="0.9"/><text x="1084.0" y="197" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600" >decode</text><text x="32" y="262" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="normal" >Defaults that make the second lane: long_prefill_token_threshold = 0, watermark = 0.0, admission loop breaks instead of continuing.</text><text x="32" y="284" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="normal" >Set the threshold: up to 93% more tokens per GPU-second and about 2.3x better p90 interactivity on agentic traffic (AgentX).</text>
</svg>
